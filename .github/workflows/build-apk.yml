name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIGNAL_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SIGNAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Reuse testing signing key
        uses: actions/cache@v4
        with:
          path: ~/.signalahead/testing.jks
          key: signal-ahead-debug-signing-v2
      - name: Load configured durable signing key
        env:
          KEY_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_DATA" ]; then
            printf '%s' "$KEY_DATA" | base64 --decode > "$RUNNER_TEMP/signal-signing.jks"
            echo "SIGNAL_KEYSTORE=$RUNNER_TEMP/signal-signing.jks" >> "$GITHUB_ENV"
          elif [ -f DEBUG-CERT-SHA256.txt ] && [ ! -f "$HOME/.signalahead/testing.jks" ]; then
            echo "Pinned testing key is missing. Configure durable signing secrets; do not silently rotate it."
            exit 1
          fi
          if [ -z "$KEY_DATA" ]; then
            mkdir -p "$HOME/.signalahead"
            if [ ! -f "$HOME/.signalahead/testing.jks" ]; then
              keytool -genkeypair -keystore "$HOME/.signalahead/testing.jks" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "SIGNAL_DEBUG_KEYSTORE=$HOME/.signalahead/testing.jks" >> "$GITHUB_ENV"
          fi
      - name: Test and build
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Verify APK and signing certificate
        run: |
          verifier=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$verifier" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > signing-info.txt
          awk '/certificate SHA-256 digest:/ {print $NF}' signing-info.txt | sort -u > built-cert.txt
          test "$(wc -l < built-cert.txt)" -eq 1
          grep -Eq '^[a-f0-9]{64}$' built-cert.txt
          if [ -z "$SIGNAL_KEYSTORE" ] && [ -f DEBUG-CERT-SHA256.txt ]; then
            diff -w DEBUG-CERT-SHA256.txt built-cert.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SignalAhead-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            signing-info.txt
            built-cert.txt
            app/build/test-results/testDebugUnitTest/
            app/schemas/
          if-no-files-found: error
          retention-days: 14
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SignalAhead-debug-apk
          path: built
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install built/app/build/outputs/apk/debug/app-debug.apk
            adb install built/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.signalahead.app.test/androidx.test.runner.AndroidJUnitRunner > instrumentation.txt
            grep -q 'OK (' instrumentation.txt
            adb shell am start -n com.signalahead.app/.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/dashboard.png
            adb pull /sdcard/dashboard.png dashboard.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-smoke-results
          path: |
            instrumentation.txt
            dashboard.png
